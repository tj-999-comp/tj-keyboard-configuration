    source_no: 16
  - switch_id: "017"
    name: gateron-g-pro-3-red
    source_no: 17

# キーごとの割り当て。
# position_id は物理位置の安定した識別子、key_name はキー名。
# switch_id に "001"〜"017" を設定する。未確認のキーは null のままにする。
