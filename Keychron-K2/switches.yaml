# Keychron K2 キースイッチ構成
#
# キースイッチの詳細は keyboardconfig_keychronk2.md の
# 「3. 使用したキースイッチ一覧」を参照する。
# switch_id は Markdown の No. と対応させる。

schema_version: 1
keyboard:
  id: keychron-k2
  name: Keychron K2
  layout: ansi-75

# キースイッチ一覧。
# 詳細情報は Markdown に集約し、ここでは識別子だけを管理する。
switches:
  - switch_id: "001"
    name: gateron-smoothie
    source_no: 1
  - switch_id: "002"
    name: durock-mocha-silk-linear
    source_no: 2
  - switch_id: "003"
    name: gateron-oil-king-v2
    source_no: 3
