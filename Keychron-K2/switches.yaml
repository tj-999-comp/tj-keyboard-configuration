    name: ttc-frozen-silent-v2
    source_no: 7
  - switch_id: "008"
    name: kailh-midnight-silent-v2-linear
    source_no: 8
  - switch_id: "009"
    name: kailh-fairy-silent-linear
    source_no: 9
  - switch_id: "010"
    name: durock-silent-dolphin
    source_no: 10
  - switch_id: "011"
    name: kailh-deep-sea-silent-pro-box
    source_no: 11
  - switch_id: "012"
